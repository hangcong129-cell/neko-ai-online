<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEKO AI</title><style>
:root{color-scheme:dark;--bg:#0d0d14;--p:#171722;--p2:#20202d;--line:#303043;--txt:#f5f2ff;--muted:#aaa7bb;--a:#b69aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 system-ui,Segoe UI,sans-serif}.app{max-width:1050px;min-height:100vh;margin:auto;display:flex;flex-direction:column}.top{height:68px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#11111a}.brand{display:flex;gap:11px;align-items:center;font-weight:800}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#6d36d6,#c7b2ff);display:grid;place-items:center;font-size:22px}.tag{font-size:10px;color:#c8b4ff;border:1px solid #58447e;padding:2px 8px;border-radius:30px}.controls{display:flex;gap:8px;align-items:center}select,button{font:inherit}.select,.btn{background:var(--p2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px}.btn{cursor:pointer}.feed{width:100%;max-width:850px;margin:auto;flex:1;padding:30px 20px 160px}.welcome{text-align:center;padding:12vh 8px 20px}.welcome .spark{font-size:48px;color:var(--a)}h1{font-size:clamp(26px,5vw,38px);margin:4px 0}.sub{color:var(--muted);max-width:560px;margin:0 auto}.ideas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:650px;margin:28px auto}.ideas button{text-align:left;background:var(--p);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:14px;cursor:pointer}.ideas button:hover,.btn:hover{border-color:var(--a)}.msg{display:flex;gap:12px;margin:24px 0;align-items:flex-start}.avatar{width:32px;height:32px;border-radius:11px;background:#262237;color:#d2c4ff;display:grid;place-items:center;font-weight:800;flex:none}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 0}.msg.user .bubble{background:var(--p);border:1px solid var(--line);border-radius:13px;padding:11px 14px}.compose-wrap{position:fixed;bottom:0;left:0;right:0;padding:25px 15px 15px;background:linear-gradient(transparent,var(--bg) 25%)}.compose{max-width:820px;margin:auto;display:flex;gap:10px;align-items:end;background:var(--p);border:1px solid #45415d;border-radius:17px;padding:10px;box-shadow:0 9px 40px #0007}.compose textarea{flex:1;background:transparent;color:var(--txt);border:0;outline:0;resize:none;font:inherit;padding:11px;min-height:48px;max-height:170px}.send{height:44px;width:46px;border:0;border-radius:12px;background:var(--a);font-weight:900;font-size:20px;cursor:pointer;color:#171021}.send:disabled{opacity:.4}.note{text-align:center;color:#777488;font-size:11px;margin:8px auto}.status{padding:10px 23px;font-size:12px;color:var(--muted)}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:20px;background:#d99b35;margin-right:8px}.status.ok:before{background:#35cc91}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:18px}.modal.show{display:grid}.box{width:min(460px,100%);padding:22px;border-radius:17px;background:var(--p);border:1px solid var(--line)}.box label{display:block;color:var(--muted);font-size:13px;margin:14px 0 5px}.box select{width:100%;background:var(--p2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.primary{background:var(--a);color:#171021;border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}@media(max-width:580px){.top{padding:0 12px}.tag{display:none}.feed{padding:20px 13px 155px}.ideas{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">N</div><div>NEKO AI <span class="tag">ONLINE</span></div></div><div class="controls"><select class="select" id="model" aria-label="Mô hình AI"></select><button class="btn" id="settings" title="Cài đặt">⚙</button><button class="btn" id="fresh" title="Chat mới">＋</button></div></header><div class="status" id="status">Đang kiểm tra AI…</div><main class="feed"><section class="welcome" id="welcome"><div class="spark">✦</div><h1>Chào mừng đến với NEKO AI</h1><p class="sub">Trợ lý AI riêng của bạn. Hỏi bài, viết code, học lập trình hoặc cùng xây dựng Minecraft Add-on.</p><div class="ideas"><button data-p="Giải thích bài toán lớp 8 từng bước, dễ hiểu.">📚 Giải bài tập</button><button data-p="Giúp mình viết một đoạn văn hay và tự nhiên.">✍️ Viết văn</button><button data-p="Giúp mình tìm lỗi trong Minecraft Bedrock Add-on.">🧩 Sửa lỗi Minecraft</button><button data-p="Dạy mình lập trình từ đầu với ví dụ đơn giản.">💻 Học lập trình</button></div></section><div id="messages"></div></main><div class="compose-wrap"><form class="compose" id="form"><textarea id="prompt" rows="1" placeholder="Nhắn tin với NEKO AI…"></textarea><button class="send" id="send" aria-label="Gửi">↑</button></form><div class="note">NEKO AI có thể mắc lỗi. Hãy kiểm tra lại thông tin quan trọng.</div></div></div><div class="modal" id="modal"><div class="box"><h2>Cài đặt NEKO</h2><label>Mô hình AI</label><select id="model2"></select><div class="actions"><button class="btn" id="close">Đóng</button><button class="primary" id="save">Lưu</button></div></div></div>
<script>
const $=x=>document.getElementById(x);let msgs=[],busy=false,aborter=null;
function status(ok,t){$('status').textContent=t;$('status').className='status'+(ok?' ok':'')}
function add(role,text,typing=false){$('welcome').style.display='none';let row=document.createElement('div');row.className='msg '+role;let a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'B':'N';let b=document.createElement('div');b.className='bubble';b.textContent=text;if(typing)b.style.color='#aaa7bb';row.append(a,b);$('messages').append(row);return b}
async function init(){try{let [a,b]=await Promise.all([fetch('/api/config'),fetch('/api/health')]);let c=await a.json();$('model').innerHTML='';$('model2').innerHTML='';for(let m of c.models){for(let s of [$('model'),$('model2')]){let o=document.createElement('option');o.value=m;o.textContent=m;s.append(o)}}$('model').value=c.model;$('model2').value=c.model;if(b.ok){let h=await b.json();status(h.connected,h.message)}else{let h=await b.json();status(false,h.message||'Chưa cấu hình AI')}}catch(e){status(false,'Không kết nối được máy chủ: '+e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;let text=$('prompt').value.trim();if(!text)return;msgs.push({role:'user',content:text});add('user',text);$('prompt').value='';$('prompt').style.height='auto';let out=add('assistant','Đang suy nghĩ…',true);busy=true;$('send').disabled=true;aborter=new AbortController();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value,messages:msgs}),signal:aborter.signal});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.error||'Lỗi HTTP '+r.status)}out.textContent='';out.style.color='';let reader=r.body.getReader(),dec=new TextDecoder(),buf='',answer='';while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let lines=buf.split('\n');buf=lines.pop();for(let l of lines){if(!l.trim())continue;let d=JSON.parse(l);if(d.error)throw Error(d.error);answer+=d.text||'';out.textContent=answer;window.scrollTo(0,document.body.scrollHeight)}}if(buf.trim()){let d=JSON.parse(buf);if(d.error)throw Error(d.error);answer+=d.text||'';out.textContent=answer}msgs.push({role:'assistant',content:answer||'Mô hình chưa trả lời.'})}catch(err){out.style.color='#ffb4b4';out.textContent=err.name==='AbortError'?'Đã dừng.':'Lỗi: '+err.message;msgs.push({role:'assistant',content:out.textContent})}finally{busy=false;$('send').disabled=false;aborter=null;$('prompt').focus()}};
$('prompt').oninput=()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,170)+'px'};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};$('fresh').onclick=()=>{msgs=[];$('messages').innerHTML='';$('welcome').style.display='block'};$('settings').onclick=()=>{$('model2').value=$('model').value;$('modal').classList.add('show')};$('close').onclick=()=>$('modal').classList.remove('show');$('save').onclick=()=>{$('model').value=$('model2').value;$('modal').classList.remove('show')};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset.p;$('form').requestSubmit()});init();
</script></body></html>
